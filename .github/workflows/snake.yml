name: Generate Snake

on:
  schedule:
    # Executa a cada 24 horas
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate-github-user-contribution-grid-snake-animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Joao-Guilherme-MS-DEV
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7B2CBF&color_dots=#EB5E28,#F5CB5C,#38B000,#0072E0,#001242
            dist/github-contribution-grid-snake-dark.svg?color_snake=#7B2CBF&color_dots=#EB5E28,#F5CB5C,#38B000,#0072E0,#001242
            
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
